<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Ostatni Peron Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap">
<style>
/* Layout: full-window voxel stage, Fallout-like metal HUD at the bottom. Single dark look by choice. */
:root{
  --bg:#0d0b09; --metal-hi:#4a463e; --metal-lo:#2a2823; --edge:#14130f;
  --term:#0b140a; --green:#7fe06a; --green-dim:#4f9a42; --amber:#e8a63a; --red:#ff5a43; --text:#d8cfb8; --muted:#a89f8a;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif; --f-term:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);overflow:hidden;margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--bg)}
#c{image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 65%,rgba(0,0,0,.35))}
#top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));background:rgba(10,9,7,.74);border:1px solid #6b5c3c;padding:8px 14px;display:flex;flex-direction:column;gap:2px;max-width:min(560px,calc(100% - 32px))}
#top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--amber)}
#top p{margin:0;font-size:15px;color:var(--muted);letter-spacing:.02em;line-height:1.3}
#tip{position:absolute;pointer-events:none;background:rgba(10,8,6,.9);border:1px solid var(--red);padding:3px 8px;font-family:var(--f-term);font-size:19px;color:#ffb39e;white-space:nowrap}
#dead{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#dead div{font-family:var(--f-term);font-size:48px;color:var(--red);text-shadow:0 0 12px #000,0 0 4px #000;letter-spacing:.06em}
#hud{flex:none;display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--metal-hi),var(--metal-lo));border-top:3px solid var(--edge)}
#log{flex:1 1 300px;min-width:0;height:92px;box-sizing:border-box;background:var(--term);border:3px solid #191812;border-radius:6px;box-shadow:inset 0 0 18px rgba(0,0,0,.9);padding:6px 12px;font-family:var(--f-term);font-size:19px;line-height:1.1;color:var(--green);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div.old{color:var(--green-dim)}
#log div.hit{color:#ffb070}
.grp{display:flex;flex-direction:column;gap:6px;justify-content:center}
.lbl{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
#weapons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
button{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;color:#e9dfc4;background:linear-gradient(#6a655a,#3d3a33);border:2px solid #1a1914;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);cursor:pointer;min-height:44px;padding:0 10px;font-size:16px}
button:hover{background:linear-gradient(#7a7466,#48443b)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.on{border-color:var(--amber);color:#ffe2a8;background:linear-gradient(#7a5a2c,#4a3818)}
button kbd{font-family:var(--f-term);font-size:17px;color:var(--amber);margin-right:4px}
#side{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#stats{font-family:var(--f-term);font-size:17px;color:var(--muted);min-width:150px;font-variant-numeric:tabular-nums}
@media (max-width:700px){#log{flex-basis:100%;height:70px}#top p{display:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Izometryczna scena wokselowa: zrujnowany blok, złomiarze, pies, worki z piaskiem"></canvas>
    <div id="vig"></div>
    <div id="top">
      <h1>OSIEDLE SŁONECZNE · DEMO</h1>
      <p>Celuj i klikaj. 1–4 broń, Spacja zwolnione tempo, T wrogowie strzelają, R od nowa. Rozwal parter bloku ładunkiem, a reszta runie.</p>
    </div>
    <div id="tip" hidden></div>
    <div id="dead" hidden><div>NIE ŻYJESZ · R</div></div>
  </div>
  <div id="hud">
    <div id="log" aria-live="polite"></div>
    <div class="grp">
      <div class="lbl">BROŃ</div>
      <div id="weapons">
        <button data-w="0" class="on"><kbd>1</kbd>Karabin</button>
        <button data-w="1"><kbd>2</kbd>Strzelba</button>
        <button data-w="2"><kbd>3</kbd>Granat</button>
        <button data-w="3"><kbd>4</kbd>Ładunek</button>
      </div>
    </div>
    <div class="grp">
      <div class="lbl">SYMULACJA</div>
      <div id="side">
        <button id="bSlow"><kbd>␣</kbd>Zwolnij</button>
        <button id="bFire"><kbd>T</kbd>Ogień wroga</button>
        <button id="bReset"><kbd>R</kbd>Od nowa</button>
      </div>
    </div>
    <div class="grp"><div class="lbl">STAN</div><div id="stats">—</div></div>
  </div>
</div>

<script>
'use strict';
(()=>{
// ---------- world constants ----------
const W=224,D=224,H=88,WD=W*D,N=WD*H,GZ=5,G=0.04;
const BW=(W+D)*2+8,BH=(W+D)+2*H+8,OX=2*D,OY=2*H,PIX=BW*BH,NEG=-32768;
const grid=new Uint32Array(N),mat=new Uint8Array(N),vis=new Uint32Array(N);
const sCol=new Uint32Array(PIX),sDep=new Int16Array(PIX),sPick=new Int32Array(PIX),bg=new Uint32Array(PIX);
const fDep=new Int16Array(PIX),fPick=new Int32Array(PIX),shMark=new Uint8Array(PIX);
const cv=document.getElementById('c');cv.width=BW;cv.height=BH;
const ctx=cv.getContext('2d');
const img=ctx.createImageData(BW,BH);const fCol=new Uint32Array(img.data.buffer);
const rnd=Math.random;
const I=(x,y,z)=>x+y*W+z*WD;

// ---------- color + noise ----------
function hsh(x,y,z){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function noise2(x,y,s,k){const fx=x/s,fy=y/s,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;const a=hsh(ix,iy,k),b=hsh(ix+1,iy,k),c=hsh(ix,iy+1,k),d=hsh(ix+1,iy+1,k);const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}
function rgb(r,g,b){r=r<0?0:r>255?255:r|0;g=g<0?0:g>255?255:g|0;b=b<0?0:b>255?255:b|0;return ((r<<16)|(g<<8)|b)||0x010101;}
function jit(r,g,b,a,x,y,z){const n=(hsh(x,y,z)-.5)*2*a;return rgb(r+n,g+n*.95,b+n*.9);}
function jr(r,g,b,a){const n=(rnd()-.5)*2*a;return rgb(r+n,g+n,b+n);}
function scl(c,f){return rgb(((c>>16)&255)*f,((c>>8)&255)*f,(c&255)*f);}
function mixRGB(a,b,t){return rgb(((a>>16)&255)*(1-t)+((b>>16)&255)*t,((a>>8)&255)*(1-t)+((b>>8)&255)*t,(a&255)*(1-t)+(b&255)*t);}
function shp(c,f){let r=((c>>16)&255)*f,g=((c>>8)&255)*f,b=(c&255)*f;if(r>255)r=255;if(g>255)g=255;if(b>255)b=255;return (0xff000000|((b|0)<<16)|((g|0)<<8)|(r|0))>>>0;}
function darkP(c,f){const r=(c&255)*f,g=((c>>8)&255)*f,b=((c>>16)&255)*f;return (0xff000000|((b|0)<<16)|((g|0)<<8)|(r|0))>>>0;}
function bloodC(){const v=rnd();return rgb(100+v*60,8+v*12,6+v*10);}

// ---------- background ----------
for(let y=0;y<BH;y++){const t=y/BH;for(let x=0;x<BW;x++){const n=(rnd()-.5)*5;bg[y*BW+x]=shp(rgb(34+10*t+n,30+9*t+n,27+7*t+n),1);}}

// ---------- sprite raster ----------
function spr(col,dep,pick,sx,sy,d,ct,cl,cr,pk){
  if(sx<0||sy<0||sx>BW-4||sy>BH-4)return;
  let p=sy*BW+sx;
  for(let r=0;r<2;r++,p+=BW){for(let c=0;c<4;c++){const q=p+c;if(d>dep[q]){dep[q]=d;col[q]=ct;pick[q]=pk;}}}
  for(let r=0;r<2;r++,p+=BW){
    if(d>dep[p]){dep[p]=d;col[p]=cl;pick[p]=pk;}
    if(d>dep[p+1]){dep[p+1]=d;col[p+1]=cl;pick[p+1]=pk;}
    if(d>dep[p+2]){dep[p+2]=d;col[p+2]=cr;pick[p+2]=pk;}
    if(d>dep[p+3]){dep[p+3]=d;col[p+3]=cr;pick[p+3]=pk;}
  }
}
function drawStatic(x,y,z,i){
  const c=grid[i];let sh=1;
  for(let k=1;k<64;k++){const xx=x-k,zz=z+k;if(xx<0||zz>=H)break;if(grid[i-k+k*WD]){sh=0;break;}}
  let ao=1;if(z+1<H){const up=i+WD;if(x>0&&grid[up-1])ao-=.08;if(y>0&&grid[up-W])ao-=.08;}
  spr(sCol,sDep,sPick,(x-y)*2+OX,x+y-2*z+OY,2*(x+y+z)+3,shp(c,(sh?1.16:.74)*ao),shp(c,sh?.94:.7),shp(c,sh?.72:.58),i);
}
function hidden(x,y,z,i){return x<W-1&&y<D-1&&z<H-1&&grid[i+1]&&grid[i+W]&&grid[i+WD];}
function fullRender(){
  sCol.set(bg);sDep.fill(NEG);sPick.fill(-1);
  for(let z=0;z<H;z++)for(let y=0;y<D;y++){let i=I(0,y,z);for(let x=0;x<W;x++,i++){if(!grid[i]||hidden(x,y,z,i))continue;drawStatic(x,y,z,i);}}
}
function regionRender(x0,y0,x1,y1){
  x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(BW-1,x1|0);y1=Math.min(BH-1,y1|0);if(x1<x0||y1<y0)return;
  for(let y=y0;y<=y1;y++){const o=y*BW;sCol.set(bg.subarray(o+x0,o+x1+1),o+x0);sDep.fill(NEG,o+x0,o+x1+1);sPick.fill(-1,o+x0,o+x1+1);}
  const uMin=Math.floor((x0-3-OX)/2),uMax=Math.ceil((x1-OX)/2),vMin=y0-3-OY,vMax=y1-OY;
  for(let u=uMin;u<=uMax;u++)for(let v=vMin;v<=vMax;v++){
    if((u+v)&1)continue;const bx=(v+u)>>1,by=(v-u)>>1;
    const zs=Math.max(0,-bx,-by),ze=Math.min(H-1,W-1-bx,D-1-by);
    for(let z=zs;z<=ze;z++){const x=bx+z,y=by+z,i=x+y*W+z*WD;if(grid[i]&&!hidden(x,y,z,i))drawStatic(x,y,z,i);}
  }
}
let dx0=1e9,dy0=1e9,dx1=-1e9,dy1=-1e9;
function dirtyV(x,y,z){const sx=(x-y)*2+OX,sy=x+y-2*z+OY;if(sx<dx0)dx0=sx;if(sx+3>dx1)dx1=sx+3;if(sy<dy0)dy0=sy;if(sy+3>dy1)dy1=sy+3;}
function flushDirty(){if(dx0>dx1)return;const a=(dx1-dx0)*(dy1-dy0);if(a>150000)fullRender();else regionRender(dx0,dy0,dx1,dy1);dx0=dy0=1e9;dx1=dy1=-1e9;}

// ---------- voxel api ----------
function solid(x,y,z){if(z<0)return true;if(z>=H||x<0||y<0||x>=W||y>=D)return false;return grid[x+y*W+z*WD]!==0;}
function setG(x,y,z,c,m){x|=0;y|=0;z|=0;if(x<0||y<0||z<0||x>=W||y>=D||z>=H)return;const i=I(x,y,z);grid[i]=c;mat[i]=m;}
function addVoxel(x,y,z,c,m){if(x<0||y<0||z<1||x>=W||y>=D||z>=H)return false;const i=I(x,y,z);if(grid[i])return false;grid[i]=c;mat[i]=m;drawStatic(x,y,z,i);return true;}
function settleVoxel(x,y,z,c,m){x|=0;y|=0;z|=0;if(x<0||y<0||x>=W||y>=D)return;if(z<1)z=1;while(z<H&&grid[I(x,y,z)])z++;if(z<H)addVoxel(x,y,z,c,m);}
function dropVoxel(x,y,z,c,m){x|=0;y|=0;z|=0;if(x<0||y<0||x>=W||y>=D)return;if(z>=H)z=H-1;if(z<1)z=1;if(grid[I(x,y,z)]){settleVoxel(x,y,z,c,m);return;}while(z>1&&!grid[I(x,y,z-1)])z--;addVoxel(x,y,z,c,m);}
function stainVoxel(x,y,z){
  if(x<0||y<0||z<0||x>=W||y>=D||z>=H)return;const i=I(x,y,z);const c=grid[i];if(!c||mat[i]===8)return;
  grid[i]=mixRGB(c,rgb(120,14,12),.6);
  const sx=(x-y)*2+OX,sy=x+y-2*z+OY;if(sx<0||sy<0||sx>BW-4||sy>BH-4)return;
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){const p=(sy+r)*BW+sx+k;if(sPick[p]===i){const o=sCol[p];const L=((o&255)+((o>>8)&255)+((o>>16)&255))/3;const nr=Math.min(255,L*.75+50),ng=L*.12,nb=L*.1;sCol[p]=(0xff000000|((nb|0)<<16)|((ng|0)<<8)|(nr|0))>>>0;}}
}

// ---------- world generation ----------
const FONT={Z:['111','001','010','100','111'],O:['111','101','101','101','111'],S:['111','100','111','001','111'],T:['111','010','010','010','010'],A:['010','101','111','101','101'],N:['101','111','111','101','101'],W:['101','101','101','111','101'],U:['101','101','101','101','111'],E:['111','100','110','100','111'],L:['100','100','100','100','111'],' ':['000','000','000','000','000']};
let barrels=[];
function genGround(){
  for(let y=0;y<D;y++)for(let x=0;x<W;x++){
    setG(x,y,0,rgb(36,32,29),1);
    const road=y>=88&&y<=113,n=noise2(x,y,22,1),n2=noise2(x,y,7,2);
    for(let z=1;z<4;z++)setG(x,y,z,road?jit(78,74,68,6,x,y,z):jit(84,68,50,7,x,y,z),12);
    let c,m=12;
    if(road){
      m=11;
      if(y===88||y===113){c=jit(122,118,110,5,x,y,4);m=2;setG(x,y,GZ,jit(130,126,118,5,x,y,5),2);}
      else if((y===100||y===101)&&((x>>3)&1)===0&&hsh(x,y,9)>.25)c=jit(150,140,98,8,x,y,4);
      else{const cr=noise2(x,y,5,3);c=Math.abs(cr-.5)<.03?rgb(36,35,33):jit(64,62,57,7,x,y,4);if(n2>.74)c=jit(80,76,66,6,x,y,4);}
    }else{
      if(n>.62)c=jit(102,86,62,8,x,y,4);else{const t=n2;c=jit(70+26*t,80+20*t,48+12*t,7,x,y,4);}
      const r=hsh(x,y,11);
      if(r<.05)setG(x,y,GZ,jit(96,112,60,10,x,y,5),5);
      else if(r<.056){setG(x,y,GZ,jit(150,132,82,10,x,y,5),5);setG(x,y,GZ+1,jit(160,140,86,10,x,y,6),5);}
    }
    setG(x,y,4,c,m);
  }
  const holes=[[60,94,2.5],[132,108,2],[180,99,3],[20,104,2]];
  for(const [hx,hy,hr] of holes)for(let y=hy-4;y<=hy+4;y++)for(let x=hx-4;x<=hx+4;x++)if(Math.hypot(x-hx,y-hy)<hr)setG(x,y,4,0,0);
}
function genCarve(cx,cy,cz,r){
  for(let z=Math.max(GZ,cz-r-4|0);z<=Math.min(H-1,cz+r+4|0);z++)for(let y=Math.max(0,cy-r-4|0);y<=Math.min(D-1,cy+r+4|0);y++)for(let x=Math.max(0,cx-r-4|0);x<=Math.min(W-1,cx+r+4|0);x++){
    const i=I(x,y,z);if(!grid[i])continue;const d=Math.hypot(x-cx,y-cy,(z-cz)*1.1)+(hsh(x,y,z)-.5)*2;
    if(d<r){grid[i]=0;mat[i]=0;}else if(d<r+3.5)grid[i]=scl(grid[i],.45+.45*(d-r)/3.5);
  }
}
function genBlok(){
  const x0=26,y0=22,x1=117,y1=49,fh=12,top=61;
  const wp=[[140,128,100],[118,132,126],[150,118,108],[126,116,138],[148,144,118]];
  for(let rel=0;rel<=top;rel++){
    const z=GZ+rel,fr=rel%fh,k=Math.floor(rel/fh),slab=fr<=1||rel>=60;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const outer=x===x0||x===x1||y===y0||y===y1;
      const inner=!outer&&(x===x0+1||x===x1-1||y===y0+1||y===y1-1);
      const wall=outer||inner;
      const part=!wall&&!slab&&(x-x0)%30===0&&!(y>=y0+12&&y<=y0+15&&fr>=2&&fr<=9);
      if(!wall&&!slab&&!part)continue;
      let c,m=2;
      if(wall&&!slab){
        const longSide=(y<=y0+1||y>=y1-1)&&x>x0+1&&x<x1-1;
        const a=longSide?x-x0:y-y0,L=longSide?(x1-x0):(y1-y0);
        const wi=a-4,wm=((wi%10)+10)%10;
        const inWX=wi>=0&&wm<6&&a<L-3,inWZ=fr>=4&&fr<=9;
        if(longSide&&y>=y1-1&&a>=70&&a<=77&&fr>=2&&fr<=10&&k===0)continue;
        if(inWX&&inWZ){
          if(k===0){if(!outer)continue;c=((a+fr)%3===0)?jit(70,52,34,6,x,y,z):jit(104,78,50,10,x,y,z);setG(x,y,z,c,3);continue;}
          const wid=Math.floor(wi/10)*7+k*13+(longSide?0:100)+(y>y0+5?1:0)+(x>x0+5?3:0);
          if(outer&&hsh(wid,3,5)<.22&&hsh(x,y,z)>.25)setG(x,y,z,jit(70,94,100,8,x,y,z),8);
          continue;
        }
        if(outer){
          const pi=Math.floor(a/10),tint=(hsh(pi,k,longSide?1:2)-.5)*18;
          c=jit(156+tint,150+tint,137+tint,6,x,y,z);
          if(a%10===0||fr===2)c=scl(c,.82);
          const nearW=wi>=-1&&(wm<7||wm===9)&&a<L-2&&fr>=3&&fr<=10&&k>0;
          if(nearW)c=scl(c,.62);
          if(k>0&&(wm===2||wm===3)&&fr<4&&wi>=0)c=mixRGB(c,rgb(110,74,48),.35);
        }else{const w=wp[k%5];c=jit(w[0],w[1],w[2],6,x,y,z);}
      }else if(part){const w=wp[k%5];c=jit(w[0],w[1],w[2],6,x,y,z);}
      else{
        if(rel>=60)c=jit(68,64,60,6,x,y,z);
        else if(outer)c=jit(138,134,124,6,x,y,z);
        else c=fr===1?jit(120,96,72,8,x,y,z):jit(100,96,90,5,x,y,z);
      }
      setG(x,y,z,c,m);
    }
  }
  // balconies on the facade facing the camera
  for(let k=1;k<=4;k++)for(let w=0;w<9;w+=2){
    const ax=x0+4+w*10;if(ax+6>x1-3)continue;const zb=GZ+k*fh+3;
    for(let x=ax-1;x<=ax+6;x++)for(let y=y1+1;y<=y1+6;y++){
      setG(x,y,zb,jit(132,128,120,6,x,y,zb),2);
      if(y===y1+6||x===ax-1||x===ax+6)for(let z=zb+1;z<=zb+4;z++)if(z===zb+4||((x+y)&1)===0)setG(x,y,z,jit(104,64,44,10,x,y,z),4);
    }
  }
  // graffiti on boarded ground floor
  let gx=x0+5;
  for(const chr of 'ZOSTAŃ W TUNELU'){
    const g=FONT[chr==='Ń'?'N':chr];

    for(let k=0;k<r.pts.length;k+=3){
      const x=r.pts[k],y=r.pts[k+1],z=r.pts[k+2],sx=Math.round((x-y)*2+OX+2),sy=Math.round(x+y-2*z+OY+2);if(sx<1||sy<1||sx>=BW-1||sy>=BH-1)continue;
      const seen=fDep[sy*BW+sx]<=Math.round(2*(x+y+z))+2;ctx.fillStyle=seen?'rgba(255,214,110,.95)':'rgba(255,214,110,.35)';ctx.fillRect(sx-1,sy-1,2,2);
    }
    blastEllipse(r.end,9);
  }else if(cur===3)blastEllipse(T,15);
  else if(player.canShoot){const M=proj(...muzzle(player)),E=proj(T[0],T[1],T[2]);ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(255,90,67,.35)';ctx.beginPath();ctx.moveTo(M[0],M[1]);ctx.lineTo(E[0],E[1]);ctx.stroke();ctx.restore();}
}
const gcv=document.createElement('canvas');gcv.width=gcv.height=128;{const g=gcv.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=rnd()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}
const grain=ctx.createPattern(gcv,'repeat');
let mx=-1,my=-1;
function drawFx(){
  for(const s of smoke){ctx.fillStyle=`rgba(${s.c},${Math.max(0,s.a)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of fire){ctx.fillStyle=`rgba(255,${120+((s.a*100)|0)},40,${Math.max(0,s.a*.6)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  for(const f of flashes){const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`rgba(255,220,150,${f.a})`);g.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2);}
  for(const t of tracers){ctx.strokeStyle=`rgba(255,226,150,${t.life/7})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(t.a[0],t.a[1]);ctx.lineTo(t.b[0],t.b[1]);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.globalAlpha=.022;ctx.translate((rnd()*128)|0,(rnd()*128)|0);ctx.fillStyle=grain;ctx.fillRect(-128,-128,BW+128,BH+128);ctx.restore();
  drawAim();
  if(mx>=0){
    const hov=fPick[my*BW+mx]<=-2;ctx.fillStyle=hov?'#ff5a43':'#f2d06a';
    ctx.fillRect(mx-6,my,4,1);ctx.fillRect(mx+3,my,4,1);ctx.fillRect(mx,my-6,1,4);ctx.fillRect(mx,my+3,1,4);
  }
}

// ---------- HUD ----------
const logEl=document.getElementById('log'),tip=document.getElementById('tip'),stats=document.getElementById('stats');
function log(m,cls){const d=document.createElement('div');d.textContent='• '+m;if(cls)d.className=cls;logEl.appendChild(d);while(logEl.children.length>5)logEl.removeChild(logEl.firstChild);[...logEl.children].forEach((c,i,a)=>{if(i<a.length-2&&c.className!=='hit')c.className='old';});}
function setW(i){cur=i;document.querySelectorAll('#weapons button').forEach(b=>b.classList.toggle('on',+b.dataset.w===i));}
document.querySelectorAll('#weapons button').forEach(b=>b.addEventListener('click',()=>setW(+b.dataset.w)));
const bSlow=document.getElementById('bSlow'),bFire=document.getElementById('bFire');
function toggleSlow(){slow=!slow;bSlow.classList.toggle('on',slow);}
function toggleFire(){enemyFire=!enemyFire;bFire.classList.toggle('on',enemyFire);log(enemyFire?'Wrogowie otwierają ogień.':'Wrogowie wstrzymują ogień.');}
bSlow.addEventListener('click',toggleSlow);bFire.addEventListener('click',toggleFire);
document.getElementById('bReset').addEventListener('click',reset);
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key>='1'&&e.key<='4')setW(+e.key-1);
  else if(e.key===' '){e.preventDefault();toggleSlow();}
  else if(e.key==='r'||e.key==='R')reset();
  else if(e.key==='t'||e.key==='T')toggleFire();
});
function toBuf(e){const r=cv.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*BW),Math.floor((e.clientY-r.top)/r.height*BH)];}
cv.addEventListener('pointermove',e=>{[mx,my]=toBuf(e);if(mx<0||my<0||mx>=BW||my>=BH)mx=my=-1;tip.style.left=(e.clientX-cv.parentElement.getBoundingClientRect().left+18)+'px';tip.style.top=(e.clientY-cv.parentElement.getBoundingClientRect().top+14)+'px';});
cv.addEventListener('pointerleave',()=>{mx=my=-1;tip.hidden=true;});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const [bx,by]=toBuf(e);mx=bx;my=by;playerFire(bx,by);});
const stage=document.getElementById('stage');
function fit(){const r=stage.getBoundingClientRect();const s=Math.min(r.width/BW,r.height/BH);cv.style.width=(BW*s)+'px';cv.style.height=(BH*s)+'px';}
addEventListener('resize',fit);new ResizeObserver(fit).observe(stage);

function reset(){
  np=0;chunks=[];detached.length=0;emitters.length=0;grenades=[];pending=[];tracers=[];flashes=[];smoke=[];fire=[];
  genWorld();spawnChars();fullRender();document.getElementById('dead').hidden=true;
  logEl.innerHTML='';log('Osiedle Słoneczne. Złomiarze za barierami, snajper na balkonie, pies przy wraku.');log('Karabin odstrzeli kończynę, ładunek pod blokiem go zawali.');
}

// ---------- loop ----------
let last=performance.now(),fc=0,fpsT=last,fps=60;
function frame(now){
  const dt=Math.min(50,now-last);last=now;const ts=(dt/16.67)*(slow?.25:1);
  if(cool>0)cool-=dt/16.67;
  updChars(ts);updDetached(ts);updEmitters(ts);updChunks(ts);updParticles(ts);updGrenades(ts);updFx(ts);enemyAI(ts);
  flushDirty();
  fCol.set(sCol);fDep.set(sDep);fPick.set(sPick);shMark.fill(0);dynN=0;
  drawWorld();
  ctx.putImageData(img,0,0);drawFx();
  if(shake>.05){cv.style.transform=`translate(${(rnd()-.5)*shake}px,${(rnd()-.5)*shake}px)`;shake*=.86;}else if(shake){shake=0;cv.style.transform='';}
  if(mx>=0){const p=fPick[my*BW+mx];if(p<=-2){const part=dynPart[-p-2],ch=part.owner;if(part.attached&&ch){tip.textContent=`${ch.name} · ${part.label} · PŻ ${Math.max(0,Math.round(part.hp))}`;tip.hidden=false;}else{tip.textContent=part.label;tip.hidden=false;}}else tip.hidden=true;}
  fc++;if(now-fpsT>500){fps=Math.round(fc*1000/(now-fpsT));fc=0;fpsT=now;let cv2=0;for(const c of chunks)cv2+=c.n;stats.textContent=`${fps} kl./s · cząstki ${np}${cv2?` · spada ${cv2}`:''}${slow?' · ZWOLNIONE':''}`;}
  requestAnimationFrame(frame);
}
reset();fit();requestAnimationFrame(frame);
})();
</script>
