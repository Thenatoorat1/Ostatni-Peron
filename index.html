<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}</style></head><body>
<title>Ostatni Peron Prerender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap">
<style>
/* Layout: full-window sprite stage, metal HUD at the bottom. Single dark look by choice. */
:root{
  --bg:#0d0b09; --metal-hi:#4a463e; --metal-lo:#2a2823; --edge:#14130f;
  --term:#0b140a; --green:#7fe06a; --green-dim:#4f9a42; --amber:#e8a63a; --red:#ff5a43; --text:#d8cfb8; --muted:#a89f8a;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif; --f-term:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);overflow:hidden;margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--bg)}
#c{image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;display:block;position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 65%,rgba(0,0,0,.35))}
#top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));background:rgba(10,9,7,.78);border:1px solid #6b5c3c;padding:8px 14px;display:flex;flex-direction:column;gap:2px;max-width:min(600px,calc(100% - 32px))}
#top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--amber)}
#top p{margin:0;font-size:15px;color:var(--muted);letter-spacing:.02em;line-height:1.3}
#tip{position:absolute;pointer-events:none;background:rgba(10,8,6,.92);border:1px solid var(--red);padding:3px 8px;font-family:var(--f-term);font-size:19px;color:#ffb39e;white-space:nowrap}
#dead{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#dead div{font-family:var(--f-term);font-size:48px;color:var(--red);text-shadow:0 0 12px #000,0 0 4px #000;letter-spacing:.06em}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-term);font-size:30px;color:var(--green);background:var(--bg)}
#hud{flex:none;display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--metal-hi),var(--metal-lo));border-top:3px solid var(--edge)}
#log{flex:1 1 300px;min-width:0;height:92px;box-sizing:border-box;background:var(--term);border:3px solid #191812;border-radius:6px;box-shadow:inset 0 0 18px rgba(0,0,0,.9);padding:6px 12px;font-family:var(--f-term);font-size:19px;line-height:1.1;color:var(--green);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div.old{color:var(--green-dim)}
#log div.hit{color:#ffb070}
.grp{display:flex;flex-direction:column;gap:6px;justify-content:center}
.lbl{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
#weapons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#stance{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;color:#e9dfc4;background:linear-gradient(#6a655a,#3d3a33);border:2px solid #1a1914;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);cursor:pointer;min-height:44px;padding:0 10px;font-size:16px}
button:hover{background:linear-gradient(#7a7466,#48443b)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.on{border-color:var(--amber);color:#ffe2a8;background:linear-gradient(#7a5a2c,#4a3818)}
button kbd{font-family:var(--f-term);font-size:17px;color:var(--amber);margin-right:4px}
#side{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#stats{font-family:var(--f-term);font-size:17px;color:var(--muted);min-width:150px;font-variant-numeric:tabular-nums}
@media (max-width:700px){#log{flex-basis:100%;height:70px}#top p{display:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Izometryczna scena z prerenderowanych sprite'ów: zrujnowana kamienica, pawilon, wrak auta, złomiarze i wilczur"></canvas>
    <div id="vig"></div>
    <div id="tip" hidden></div>
    <div id="dead" hidden><div>NIE ŻYJESZ · R</div></div>
    <div id="loading">WCZYTUJĘ GRAFIKĘ…</div>
  </div>
  <div id="hud">
    <div id="log" aria-live="polite"></div>
    <div class="grp">
      <div class="lbl">BROŃ</div>
      <div id="weapons">
        <button data-w="0" class="on"><kbd>1</kbd>Karabin</button>
        <button data-w="1"><kbd>2</kbd>Strzelba</button>
        <button data-w="2"><kbd>3</kbd>Granat</button>
        <button data-w="3"><kbd>4</kbd>Ładunek</button>
        <button data-w="4"><kbd>5</kbd>Mołotow</button>
      </div>
    </div>
    <div class="grp">
      <div class="lbl">POSTAWA</div>
      <div id="stance">
        <button data-s="stand" class="on"><kbd>C</kbd>Stój</button>
        <button data-s="crouch"><kbd>C</kbd>Kucnij</button>
        <button data-s="prone"><kbd>X</kbd>Padnij</button>
      </div>
    </div>
    <div class="grp">
      <div class="lbl">SYMULACJA</div>
      <div id="side">
        <button id="bSlow"><kbd>␣</kbd>Zwolnij</button>
        <button id="bReset"><kbd>R</kbd>Od nowa</button>
      </div>
    </div>
    <div class="grp">
      <div class="lbl">KAMERA I DŹWIĘK</div>
      <div id="side2" style="display:flex;gap:6px;flex-wrap:wrap">
        <button id="bRotL" aria-label="Obróć kamerę w lewo"><kbd>Q</kbd>⟲</button>
        <button id="bRotR" aria-label="Obróć kamerę w prawo"><kbd>E</kbd>⟳</button>
        <button id="bZoomIn" aria-label="Przybliż"><kbd>+</kbd>Zoom</button>
        <button id="bZoomOut" aria-label="Oddal"><kbd>−</kbd>Zoom</button>
        <button id="bMute"><kbd>M</kbd>Dźwięk</button>
      </div>
    </div>
    <div class="grp"><div class="lbl">STAN</div><div id="stats">—</div></div>
  </div>
</div>

<script>
'use strict';
(()=>{
// ================= constants =================
const W=300,D=300,H=180,G=0.04;
const BW=(W+D)*2+8,BH=(W+D)+2*H+8,OX=2*D,OY=2*H,PIX=BW*BH;
const LX=-.6,LY=.3,LZ=1,LL=Math.hypot(LX,LY,LZ),Lx=LX/LL,Ly=LY/LL,Lz=LZ/LL;
const AMB=.55,DIF=.62,BR=1.08;
const rnd=Math.random;
const proj=(x,y,z)=>[(x-y)*2+OX,x+y-2*z+OY];
function toWorld(sx,d,z,o){const df=(sx-OX)/2,s=d-z;o[0]=(s+df)/2;o[1]=(s-df)/2;o[2]=z;return o;}

// ================= colour helpers =================
function hsh(x,y,z){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function noise2(x,y,s,k){const fx=x/s,fy=y/s,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;const a=hsh(ix,iy,k),b=hsh(ix+1,iy,k),c=hsh(ix,iy+1,k),d=hsh(ix+1,iy+1,k);const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}
function rgb(r,g,b){r=r<0?0:r>255?255:r|0;g=g<0?0:g>255?255:g|0;b=b<0?0:b>255?255:b|0;return ((r<<16)|(g<<8)|b)||0x010101;}
function jit(r,g,b,a,x,y,z){const n=(hsh(x,y,z)-.5)*2*a;return rgb(r+n,g+n*.95,b+n*.9);}
function jr(r,g,b,a){const n=(rnd()-.5)*2*a;return rgb(r+n,g+n,b+n);}
function scl(c,f){return rgb(((c>>16)&255)*f,((c>>8)&255)*f,(c&255)*f);}
function mixRGB(a,b,t){return rgb(((a>>16)&255)*(1-t)+((b>>16)&255)*t,((a>>8)&255)*(1-t)+((b>>8)&255)*t,(a&255)*(1-t)+(b&255)*t);}
function shp(c,f){let r=((c>>16)&255)*f,g=((c>>8)&255)*f,b=(c&255)*f;if(r>255)r=255;if(g>255)g=255;if(b>255)b=255;return (0xff000000|((b|0)<<16)|((g|0)<<8)|(r|0))>>>0;}
function darkP(c,f){f=f<0?0:f>1?1:f;const r=(c&255)*f,g=((c>>8)&255)*f,b=((c>>16)&255)*f;return (0xff000000|((b|0)<<16)|((g|0)<<8)|(r|0))>>>0;}
function blendP(a,b,t){const u=1-t;return (0xff000000|((((a>>16)&255)*u+((b>>16)&255)*t)<<16)|((((a>>8)&255)*u+((b>>8)&255)*t)<<8)|(((a&255)*u+(b&255)*t)|0))>>>0;}
function rgbOf(c){return ((c&255)<<16)|(c&0xff00)|((c>>>16)&255);}
function bloodC(){const v=rnd();return rgb(110+v*60,8+v*12,6+v*10);}
const BLOODP=shp(rgb(130,14,12),1);

// ================= assets (sprites made outside: Magnific images + Blender renders) =================
const ASSET='assets/';
async function loadPix(src){
  const im=new Image();im.src=src;await im.decode();
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);
  return {w:c.width,h:c.height,d:new Uint32Array(g.getImageData(0,0,c.width,c.height).data.buffer.slice(0))};
}
function cut(A,r){const [x,y,w,h]=r,o=new Uint32Array(w*h);for(let v=0;v<h;v++)o.set(A.d.subarray((y+v)*A.w+x,(y+v)*A.w+x+w),v*w);return o;}
let WORLD=null,PRISTINE=null,blocked=new Uint8Array(W*D);
const HUMAN_DEFS={legL:['lewa noga','lewą nogę','leg',55,true],legR:['prawa noga','prawą nogę','leg',55,true],torso:['tułów','tułów','torso',110,false],armL:['lewa ręka','lewą rękę','arm',45,true],armR:['prawa ręka','prawą rękę','arm',45,true],head:['głowa','głowę','head',40,true]};
const DOG_DEFS={body:['tułów','tułów','torso',70,false],head:['łeb','łeb','head',35,true],legFL:['przednia łapa','przednią łapę','leg',25,true],legFR:['przednia łapa','przednią łapę','leg',25,true],legBL:['tylna łapa','tylną łapę','leg',25,true],legBR:['tylna łapa','tylną łapę','leg',25,true],tail:['ogon','ogon','tail',15,true]};
const TYPES={};
async function loadAssets(){
  const [wj,cj,ground,wc,wg,cc,cg,wm]=await Promise.all([
    fetch(ASSET+'world.json').then(r=>r.json()),fetch(ASSET+'chars.json').then(r=>r.json()),
    loadPix(ASSET+'ground.png'),loadPix(ASSET+'world_color.png'),loadPix(ASSET+'world_geo.png'),loadPix(ASSET+'chars_color.png'),loadPix(ASSET+'chars_geo.png'),loadPix(ASSET+'world_mat.png')]);
  // static objects
  const list=[];
  {const dep=new Float32Array(PIX),zh=new Float32Array(PIX);for(let y=0;y<BH;y++)dep.fill(y+.5-OY,y*BW,(y+1)*BW);
   list.push({name:'Ziemia',mat:12,ex:false,x0:0,y0:0,w:BW,h:BH,layers:[{col:ground.d,dep,zh,mt:new Uint8Array(PIX).fill(1)}],thick:5,c:[0,0,0],fp:null,blocks:false});}
  for(const m of wj.objects){
    const layers=m.layers.map(t=>{const r=wj.rects[t],col=cut(wc,r),g=cut(wg,r),n=col.length,dep=new Float32Array(n),zh=new Float32Array(n);
      const mm=cut(wm,r),mt=new Uint8Array(n);for(let k=0;k<n;k++){const v=g[k];dep[k]=(((v&255)<<8)|((v>>8)&255))/16;zh[k]=(v>>16)&255;mt[k]=mm[k]&255;}return {col,dep,zh,mt};});
    list.push({name:m.name,mat:m.mat,ex:m.ex,x0:m.x0,y0:m.y0,w:m.w,h:m.h,layers,thick:m.thick,c:m.c,fp:m.fp,blocks:m.blocks,topple:m.topple});
  }
  PRISTINE=list;
  // characters
  for(const key of ['ty','zlom','pies']){
    const t=cj.types[key],defsSrc=key==='pies'?DOG_DEFS:HUMAN_DEFS;
    const defs=t.parts.map(p=>{const a=defsSrc[p];return {name:p,label:a[0],acc:a[1],kind:a[2],hp0:a[3],sever:a[4]};});
    const frames=t.frames.map(fr=>fr.map(e=>{
      if(!e)return null;const r=cj.rects[e[0]],col=cut(cc,r),g=cut(cg,r),n=col.length,dep=new Float32Array(n),zh=new Float32Array(n);
      let su=0,sv=0,sd=0,sz=0,c=0;
      for(let k=0;k<n;k++){if(!col[k])continue;const v=g[k];dep[k]=(v&255)/2-64;zh[k]=((v>>8)&255)/4;su+=k%r[2];sv+=(k/r[2])|0;sd+=dep[k];sz+=zh[k];c++;}
      return {ox:e[1],oy:e[2],w:r[2],h:r[3],col,dep,zh,cu:su/c,cv:sv/c,md:sd/c,mz:sz/c};}));
    const pidx={};defs.forEach((d,i)=>pidx[d.name]=i);
    const P={};t.poseNames.forEach((n,i)=>P[n]=i);
    TYPES[key]={key,name:{ty:'Ty',zlom:'Złomiarz',pies:'Zdziczały pies'}[key],kind:key==='pies'?'dog':'human',defs,frames,joints:t.joints,np:defs.length,pidx,P,NP:t.poseNames.length,poseNames:t.poseNames};
  }
}
function resetWorld(){
  objs=PRISTINE.map(o=>Object.assign({},o,{boom:false,layers:o.layers.map(l=>({col:l.col.slice(),dep:l.dep,zh:l.zh,mt:l.mt}))}));
  DEB=objs.length;
  objs.push({name:'Gruz',mat:2,ex:false,x0:0,y0:0,w:BW,h:BH,layers:[{col:new Uint32Array(PIX),dep:new Float32Array(PIX).fill(-1e9),zh:new Float32Array(PIX)}],thick:1.5,c:[0,0,0]});
  blocked.fill(0);
  for(const o of objs){if(!o.blocks||!o.fp)continue;const [a,b,c,d]=o.fp;for(let y=Math.max(0,Math.floor(b));y<Math.min(D,Math.ceil(d));y++)for(let x=Math.max(0,Math.floor(a));x<Math.min(W,Math.ceil(c));x++)blocked[x+y*W]=1;}
  for(const o of objs){o.cx=o.c[0];o.cy=o.c[1];o.cz=o.c[2];}
}
let objs=[],DEB=0;


// ================= runtime buffers =================
const cv=document.getElementById('c');cv.width=BW;cv.height=BH;
const ctx=cv.getContext('2d');
const img=ctx.createImageData(BW,BH);const fCol=new Uint32Array(img.data.buffer);
const sCol=new Uint32Array(PIX),sDep=new Float32Array(PIX),sZ=new Float32Array(PIX),sObj=new Int16Array(PIX),sLay=new Uint8Array(PIX),bg=new Uint32Array(PIX),shMask=new Uint8Array(PIX);
const fDep=new Float32Array(PIX),fZ=new Float32Array(PIX),fPick=new Int32Array(PIX),shMark=new Uint8Array(PIX),cMask=new Uint8Array(PIX),xMask=new Uint8Array(PIX);
const DW=W*2,DDH=D*2,dHt=new Float32Array(DW*DDH);
for(let y=0;y<BH;y++){const t=y/BH;for(let x=0;x<BW;x++){const n=(rnd()-.5)*5;bg[y*BW+x]=shp(rgb(34+10*t+n,30+9*t+n,27+7*t+n),1);}}

function compose(x0,y0,x1,y1){
  x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(BW-1,x1|0);y1=Math.min(BH-1,y1|0);if(x1<x0||y1<y0)return;
  for(let y=y0;y<=y1;y++){const o=y*BW;sCol.set(bg.subarray(o+x0,o+x1+1),o+x0);sDep.fill(-1e9,o+x0,o+x1+1);sObj.fill(-1,o+x0,o+x1+1);sZ.fill(0,o+x0,o+x1+1);}
  for(let oi=0;oi<objs.length;oi++){
    const ob=objs[oi],ax0=Math.max(x0,ob.x0),ax1=Math.min(x1,ob.x0+ob.w-1),ay0=Math.max(y0,ob.y0),ay1=Math.min(y1,ob.y0+ob.h-1);
    if(ax1<ax0||ay1<ay0)continue;const sg=oi===0||oi===DEB;
    for(let L=0;L<ob.layers.length;L++){const ly=ob.layers[L],C=ly.col,Dp=ly.dep,Z=ly.zh;
      for(let y=ay0;y<=ay1;y++){let k=(y-ob.y0)*ob.w+(ax0-ob.x0),p=y*BW+ax0;
        for(let x=ax0;x<=ax1;x++,k++,p++){const c=C[k];if(!c)continue;const d=Dp[k];if(d<=sDep[p])continue;sDep[p]=d;sZ[p]=Z[k];sObj[p]=oi;sLay[p]=L;sCol[p]=sg&&shMask[p]?darkP(c,.6):c;}}}
  }
}
function computeShadows(){
  shMask.fill(0);
  for(let oi=1;oi<DEB;oi++){const ob=objs[oi];for(const ly of ob.layers){const C=ly.col,Z=ly.zh;for(let y=0;y<ob.h;y++)for(let x=0;x<ob.w;x++){const k=y*ob.w+x;if(!C[k])continue;const z=Z[k];if(z<.4)continue;const tx=Math.round(ob.x0+x+1.8*z),ty=Math.round(ob.y0+y+2.3*z);if(tx<0||ty<0||tx>=BW-1||ty>=BH-1)continue;const p=ty*BW+tx;shMask[p]=1;shMask[p+1]=1;shMask[p+BW]=1;shMask[p+BW+1]=1;}}}
}
let dx0=1e9,dy0=1e9,dx1=-1e9,dy1=-1e9,shadowDirty=false,shadowTimer=0;
function dirty(x0,y0,x1,y1){if(x0<dx0)dx0=x0;if(y0<dy0)dy0=y0;if(x1>dx1)dx1=x1;if(y1>dy1)dy1=y1;}
function flushDirty(ts){
  shadowTimer-=ts;
  if(shadowDirty&&shadowTimer<=0){shadowDirty=false;shadowTimer=12;computeShadows();compose(0,0,BW-1,BH-1);dx0=dy0=1e9;dx1=dy1=-1e9;return;}
  if(dx0>dx1)return;compose(dx0,dy0,dx1,dy1);dx0=dy0=1e9;dx1=dy1=-1e9;
}

// ================= materials =================
// 1 soil 2 concrete 3 brick 4 stone 5 plaster 6 wood 7 glass 8 metal 9 roof tile 10 foliage 11 sand
const M_WOOD=6,M_GLASS=7,M_METAL=8,M_LEAF=10,M_SAND=11;
const BRITTLE=new Uint8Array(16);[1,2,3,4,5,9].forEach(m=>BRITTLE[m]=1);
// rf: how far a hit reaches into this material; k: particle kind for loose bits; dust: smoke colour
const MAT=[null,{rf:1,k:0,dust:'130,108,80'},{rf:1,k:0,dust:'176,172,162'},{rf:1,k:0,dust:'168,104,80'},{rf:.9,k:0,dust:'150,150,150'},{rf:1.15,k:0,dust:'206,198,182'},
  {rf:.35,k:5,dust:'140,110,78'},{rf:1.9,k:4,dust:null},{rf:.45,k:0,dust:null},{rf:1.25,k:0,dust:'176,104,74'},{rf:1.45,k:3,dust:null},{rf:1.05,k:6,dust:'206,186,128'},{rf:1,k:1,dust:null}];
const matOf=m=>MAT[m]||MAT[2];
const PNAME=['Grunt','Grunt','Beton','Cegła','Kamień','Tynk','Drewno','Szkło','Metal','Dachówka','Liście','Piasek'];

// ================= debris & stains =================
const SL4=[[1,0],[-1,0],[0,1],[0,-1]];
let debMt=new Uint8Array(PIX);
function dHAt(x,y){const cx=Math.floor(x*2),cy=Math.floor(y*2);if(cx<0||cy<0||cx>=DW||cy>=DDH)return 0;return dHt[cy*DW+cx];}
function debPix(sx,sy,c,d,z,m){
  if(sx<0||sy<0||sx>=BW||sy>=BH)return;const p=sy*BW+sx,L=objs[DEB].layers[0];
  if(L.col[p]&&L.dep[p]>d+.6)return;
  L.col[p]=c;L.dep[p]=d;L.zh[p]=z;debMt[p]=m||2;
  if(d>=sDep[p]-.01){sCol[p]=shMask[p]?darkP(c,.6):c;sDep[p]=d;sZ[p]=z;sObj[p]=DEB;sLay[p]=0;}
}
// grains pile up; sand has a lower angle of repose; flat=true lays litter without height (leaves, glass, blood)
function placeDebris(x,y,c,m,flat){

    if(k===5){const vx=(pvx[i]-pvy[i])*2,vy=(pvx[i]+pvy[i]-2*pvz[i]),l=Math.hypot(vx,vy)||1,ux=vx/l,uy=vy/l;
      for(let t=-1;t<=1;t++){const X=Math.round(sx+ux*t),Y=Math.round(sy+uy*t);if(X<0||Y<0||X>=BW||Y>=BH)continue;const p=Y*BW+X;if(d>fDep[p]){fCol[p]=t?darkP(c,.8):c;fDep[p]=d;}}continue;}
    if(d>fDep[q]){fCol[q]=c;fDep[q]=d;}
    if(k===0||rnd()<.5){if(d>fDep[q+1]){fCol[q+1]=darkP(c,.85);fDep[q+1]=d;}}
  }
  for(const g of grenades){
    const sx=Math.round((g.x-g.y)*2+OX+1),sy=Math.round(g.x+g.y-2*g.z+OY+1),d=g.x+g.y+g.z+30;
    if(sx<1||sy<1||sx>BW-4||sy>BH-4)continue;mbb(sx,sy);mbb(sx+2,sy+2);
    const blink=((g.fuse/6)|0)&1;
    if(g.molo){for(let r=0;r<4;r++)for(let c=0;c<2;c++){const q=(sy+r-1)*BW+sx+c;fDep[q]=d;cMask[q]=4;fCol[q]=r===0?FLAME[(rnd()*5)|0]:(c?0xff2c4a3a:0xff3c6a50);}continue;}
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){const q=(sy+r)*BW+sx+c;fDep[q]=d;cMask[q]=4;fCol[q]=(r===0&&c===1&&blink)?0xff3030ff:(r===0?0xff4a5a40:c===2?0xff2c3826:0xff3c4a34);}
  }

  outlinePass();
}
const gcv=document.createElement('canvas');gcv.width=gcv.height=128;{const g=gcv.getContext('2d'),dd=g.createImageData(128,128);for(let i=0;i<dd.data.length;i+=4){const v=rnd()*255;dd.data[i]=dd.data[i+1]=dd.data[i+2]=v;dd.data[i+3]=255;}g.putImageData(dd,0,0);}
const grain=ctx.createPattern(gcv,'repeat');
let mx=-1,my=-1;
function blastEllipse(P,r){const s=proj(P[0],P[1],P[2]);ctx.save();ctx.setLineDash([3,2]);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,90,67,.9)';ctx.fillStyle='rgba(255,90,67,.1)';ctx.beginPath();ctx.ellipse(s[0],s[1],r*2.83,r*1.41,0,0,6.2832);ctx.fill();ctx.stroke();ctx.restore();}
function drawAim(){
  if(mx<0||!player.alive)return;const T=pickWorld(mx,my);if(!T)return;
  if(cur===2||cur===4){const L=grenadeLaunch(T);if(!L)return;const r=simGrenade(L,cur===4);
    for(let k=0;k<r.pts.length;k+=3){const x=r.pts[k],y=r.pts[k+1],z=r.pts[k+2],sx=Math.round((x-y)*2+OX+1),sy=Math.round(x+y-2*z+OY+1);if(sx<1||sy<1||sx>=BW-1||sy>=BH-1)continue;
      const seen=fDep[sy*BW+sx]<=x+y+z+2;ctx.fillStyle=seen?'rgba(255,255,255,.95)':'rgba(255,255,255,.35)';ctx.fillRect(sx-1,sy-1,2,2);}
    blastEllipse(r.end,cur===4?6.5:20);}
  else if(cur===3)blastEllipse(T,32);
  else if(player.canShoot){const M=proj(...muzzle(player)),E=proj(T[0],T[1],T[2]);ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(255,90,67,.4)';ctx.beginPath();ctx.moveTo(M[0],M[1]);ctx.lineTo(E[0],E[1]);ctx.stroke();ctx.restore();}
}
function drawFx(){
  for(const s of smoke){ctx.fillStyle=`rgba(${s.c},${Math.max(0,s.a)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of fire){const a=Math.max(0,s.a);ctx.fillStyle=`rgba(255,${(60+a*150)|0},${(a*a*60)|0},${a*.42})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  for(const f of flashes){const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,`rgba(255,220,150,${f.a})`);g.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2);}

}

window.__op={get chars(){return chars},get nb(){return nb},get gb(){return gBurn.length},get amt(){return fireAmt},moloBurst,explode,setStance,rotateView,get player(){return player}};

// ================= HUD =================
const logEl=document.getElementById('log'),tip=document.getElementById('tip'),stats=document.getElementById('stats');
function log(m,cls){const d=document.createElement('div');d.textContent='• '+m;if(cls)d.className=cls;logEl.appendChild(d);while(logEl.children.length>5)logEl.removeChild(logEl.firstChild);[...logEl.children].forEach((c,i,a)=>{if(i<a.length-2&&c.className!=='hit')c.className='old';});}
function setW(i){cur=i;document.querySelectorAll('#weapons button').forEach(b=>b.classList.toggle('on',+b.dataset.w===i));}
document.querySelectorAll('#weapons button').forEach(b=>b.addEventListener('click',()=>setW(+b.dataset.w)));
const bSlow=document.getElementById('bSlow');
function toggleSlow(){slow=!slow;bSlow.classList.toggle('on',slow);}
bSlow.addEventListener('click',toggleSlow);
document.getElementById('bReset').addEventListener('click',()=>reset());
const stage=document.getElementById('stage');
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key.toLowerCase();
  if(k==='w'||k==='a'||k==='s'||k==='d'){keys[k]=true;e.preventDefault();return;}
  if(e.key==='Shift'){keys.shift=true;return;}
  if(e.key>='1'&&e.key<='5')setW(+e.key-1);
  else if(k==='c'&&ready&&player.alive)setStance(player,player.stance==='crouch'?'stand':'crouch');
  else if((k==='x'||k==='z')&&ready&&player.alive)setStance(player,player.stance==='prone'?'stand':'prone');
  else if(e.key===' '){e.preventDefault();toggleSlow();}
  else if(k==='r')reset();
  else if(k==='q')rotateView(-1);
  else if(k==='e')rotateView(1);
  else if(e.key==='+'||e.key==='=')setZoom(zoom*1.25);
  else if(e.key==='-'||e.key==='_')setZoom(zoom/1.25);
  else if(k==='m'){muted=!muted;applyMute();}
});
addEventListener('keydown',()=>initAudio(),{once:true});
addEventListener('pointerdown',()=>initAudio(),{once:true});
stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15));},{passive:false});
document.getElementById('bRotL').addEventListener('click',()=>rotateView(-1));
document.getElementById('bRotR').addEventListener('click',()=>rotateView(1));
document.getElementById('bZoomIn').addEventListener('click',()=>setZoom(zoom*1.25));
document.getElementById('bZoomOut').addEventListener('click',()=>setZoom(zoom/1.25));

addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false;});
document.querySelectorAll('#stance button').forEach(b=>b.addEventListener('click',()=>{if(ready&&player.alive)setStance(player,b.dataset.s);}));
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function toBuf(e){const r=cv.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*BW),Math.floor((e.clientY-r.top)/r.height*BH)];}
cv.addEventListener('pointermove',e=>{[mx,my]=toBuf(e);if(mx<0||my<0||mx>=BW||my>=BH)mx=my=-1;const sr=stage.getBoundingClientRect();tip.style.left=(e.clientX-sr.left+18)+'px';tip.style.top=(e.clientY-sr.top+14)+'px';});
cv.addEventListener('pointerleave',()=>{mx=my=-1;tip.hidden=true;});
cv.addEventListener('pointerdown',e=>{if(!ready)return;if(e.pointerType==='mouse'&&e.button!==0)return;const [bx,by]=toBuf(e);mx=bx;my=by;playerFire(bx,by);});

// ================= loop =================
let last=performance.now(),fc=0,fpsT=last,fps=60;
function frame(now){
  const dt=Math.min(50,now-last);last=now;const ts=(dt/16.67)*(slow?.25:1);
  if(cool>0)cool-=dt/16.67;
  updChars(ts);updDetached(ts);updEmitters(ts);updChunks(ts);updTopples(ts);updFrags(ts);updSandLeaks(ts);updParticles(ts);updGrenades(ts);updFire(ts);updFx(ts);

  {const sb=document.querySelectorAll('#stance button');sb.forEach(b=>b.classList.toggle('on',b.dataset.s===player.stance));}

  if(shake>.05){cv.style.transform=`translate(${(rnd()-.5)*shake}px,${(rnd()-.5)*shake}px)`;shake*=.86;}else if(shake){shake=0;cv.style.transform='';}

    else if(p>0&&p<DEB){const ob=objs[p],k=(my-ob.y0)*ob.w+(mx-ob.x0),ly=ob.layers[sLay[my*BW+mx]]||ob.layers[0],m=ly.mt?ly.mt[k]:0;tip.textContent=ob.name+(m?' · '+PNAME[m]:'');tip.hidden=false;}else tip.hidden=true;}
